name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-suite:
    name: Fast suite (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # `services/config-server` is a public git submodule (Spring Cloud
          # Config native repo, owns the per-service yaml). The default
          # GITHUB_TOKEN reads public repositories, so no extra token is needed.
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run fast suite
        run: ./scripts/test.sh test
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-fast
          path: "**/target/surefire-reports"
          if-no-files-found: ignore

  e2e:
    name: E2E (full stack)
    runs-on: ubuntu-latest
    needs: fast-suite
    timeout-minutes: 60
    # Runs on push to main and manual dispatch. Path filters are ignored for
    # workflow_dispatch, so a manual run always executes this job.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run E2E against the real stack
        run: ./scripts/e2e-test.sh
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-e2e
          path: "**/target/surefire-reports"
          if-no-files-found: ignore