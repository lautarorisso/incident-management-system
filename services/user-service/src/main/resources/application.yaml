server:
  port: 8082

spring:
  application:
    name: user-service
  # Config Server excluded for now (see design)
  # config:
  #   import: "optional:configserver:"
  cloud:
    # config:
    #   discovery:
    #     enabled: true
    #     service-id: config-server
    loadbalancer:
      ribbon:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
    instances:
      user-service:
        baseConfig: default

# Keycloak excluded for now — block kept because KeycloakConfig bean requires
# these properties at startup. Placeholder port (no service listens on 18080).
keycloak:
  admin:
    server-url: http://localhost:18080
    realm: master
    client-id: admin-cli
    client-secret: ${KEYCLOAK_CLIENT_SECRET:changeme}
