spring:
  rabbitmq:
    listener:
      auto-startup: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
    loadbalancer:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.composite.CompositeDiscoveryClientAutoConfiguration

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.7

notification:
  email:
    enabled: false

eureka:
  client:
    enabled: false
