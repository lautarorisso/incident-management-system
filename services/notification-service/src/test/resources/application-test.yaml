spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Config server is disabled in tests, so the issuer comes from the
          # test profile directly. The Spring Security 6.5 JwtDecoder is eager
          # at startup: without issuer-uri the @SpringBootTest context fails
          # (same default as config-server notification-service.yaml).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/ims}
  rabbitmq:
    listener:
      auto-startup: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
    loadbalancer:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.composite.CompositeDiscoveryClientAutoConfiguration

notification:
  email:
    enabled: false

eureka:
  client:
    enabled: false
