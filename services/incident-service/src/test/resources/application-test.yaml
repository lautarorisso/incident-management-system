spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Config server is disabled in tests, so the issuer comes from the
          # test profile directly. The Spring Security 6.5 JwtDecoder is eager
          # at startup: without issuer-uri the @SpringBootTest context fails
          # (same default as config-server incident-service.yaml).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/ims}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.config.client.ConfigClientAutoConfiguration
  rabbitmq:
    host: localhost
    port: 5672
eureka:
  client:
    enabled: false