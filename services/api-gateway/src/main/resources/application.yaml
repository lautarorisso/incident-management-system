server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: configserver:
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
    gateway:
      routes:
        - id: discovery-service
          uri: http://localhost:8761
          predicates: Path=/eureka/web**
          filters: SetPath=/eureka/web
        - id: incident-service
          uri: http://localhost:8082
          predicates: Path=/api/incidents/**
          filters: StripPrefix=2
        - id: notification-service
          uri: http://localhost:8083
          predicates: Path=/api/notifications/**
          filters: StripPrefix=2
        - id: user-service
          uri: http://localhost:8084
          predicates: Path=/api/users/**
          filters: StripPrefix=2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ims

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
