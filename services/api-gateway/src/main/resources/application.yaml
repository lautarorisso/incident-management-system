server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import:
      - "optional:configserver:"
      # Imported AFTER the config server so it takes precedence over it: the
      # config-server's api-gateway.yaml pins app.rate-limit to 10 req/5s,
      # which the E2E lifecycle + notification polling bursts past (429s,
      # flaky suite). This override keeps the runtime rate limit in this
      # module instead of the config-server submodule.
      - "optional:classpath:rate-limit-overrides.yaml"
  cloud:
    config:
      discovery:
        enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: incident-service-docs
              uri: lb://incident-service
              predicates: Path=/api/incidents/v3/api-docs/**
              filters:
                - RewritePath=/api/incidents(?<segment>.*), /$\{segment}
            - id: notification-service-docs
              uri: lb://notification-service
              predicates: Path=/api/notifications/v3/api-docs/**
              filters:
                - RewritePath=/api/notifications(?<segment>.*), /$\{segment}
            - id: user-service-docs
              uri: lb://user-service
              predicates: Path=/api/users/v3/api-docs/**
              filters:
                - RewritePath=/api/users(?<segment>.*), /$\{segment}
            - id: incident-service
              uri: lb://incident-service
              predicates: Path=/api/incidents/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: incident-service
                    fallbackUri: forward:/fallback/incidents
            - id: notification-service
              uri: lb://notification-service
              predicates: Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notifications
            - id: user-service
              uri: lb://user-service
              predicates: Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/users
  # JWT issuer-uri is provided by Config Server (api-gateway.yaml)

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

app:
  rate-limit:
    # 50 req / 5s window per client: the E2E incident lifecycle
    # (create + retrieve + assign + transition) plus notification polling
    # bursts past 10 req/5s and got 429s, making the suite flaky. The
    # classpath override (rate-limit-overrides.yaml) applies the same value
    # when config-server config is imported (later import wins).
    limit-for-period: 50
    refresh-period: 5s

scalar:
  enabled: true
  path: /scalar
  sources:
    - title: API Gateway
      url: /v3/api-docs
      default: true
    - title: Incident Service
      url: /api/incidents/v3/api-docs
    - title: User Service
      url: /api/users/v3/api-docs
    - title: Notification Service
      url: /api/notifications/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
    instances:
      incident-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      user-service:
        baseConfig: default
