server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
    gateway:
      routes:
        - id: discovery-service
          uri: http://localhost:8761
          predicates: Path=/eureka/web**
          filters: SetPath=/eureka/web
        - id: incident-service
          uri: lb://incident-service
          predicates: Path=/api/incidents/**
          filters: StripPrefix=2
        - id: notification-service
          uri: lb://notification-service
          predicates: Path=/api/notifications/**
          filters: StripPrefix=2
        - id: user-service
          uri: lb://user-service
          predicates: Path=/api/users/**
          filters: StripPrefix=2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ims

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
    instances:
      api-gateway:
        baseConfig: default

spring:
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
