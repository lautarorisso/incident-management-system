server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://homelab:8888"
  cloud:
    # config:
    #   discovery:
    #     enabled: true
    #     service-id: config-server
    gateway:
      server:
        webflux:
          routes:
            - id: discovery-service
              uri: http://${DISCOVERY_HOST:localhost}:8761
              predicates: Path=/eureka/web**
              filters: SetPath=/eureka/web
            - id: incident-service
              uri: lb://incident-service
              predicates: Path=/api/incidents/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: incident-service
                    fallbackUri: forward:/fallback/incidents
            - id: notification-service
              uri: lb://notification-service
              predicates: Path=/api/notifications/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notifications
            - id: user-service
              uri: lb://user-service
              predicates: Path=/api/users/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/users
    loadbalancer:
      ribbon:
        enabled: false
  # Keycloak excluded for now — JWT validation disabled. Re-enable issuer-uri
  # when Keycloak is brought back (note: 8081 is now incident-service).
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: http://localhost:8081/realms/ims

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true
  path: /scalar
  sources:
    - title: API Gateway
      url: /v3/api-docs
      default: true
    - title: Incident Service
      url: /api/incidents/v3/api-docs
    - title: User Service
      url: /api/users/v3/api-docs
    - title: Notification Service
      url: /api/notifications/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
    instances:
      api-gateway:
        baseConfig: default
      incident-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      user-service:
        baseConfig: default
