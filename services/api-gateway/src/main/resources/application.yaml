server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: discovery-service
              uri: http://${DISCOVERY_HOST:localhost}:8761
              predicates: Path=/eureka/web**
              filters: SetPath=/eureka/web
            - id: incident-service-docs
              uri: lb://incident-service
              predicates: Path=/api/incidents/v3/api-docs/**
              filters:
                - RewritePath=/api/incidents(?<segment>.*), /$\{segment}
            - id: notification-service-docs
              uri: lb://notification-service
              predicates: Path=/api/notifications/v3/api-docs/**
              filters:
                - RewritePath=/api/notifications(?<segment>.*), /$\{segment}
            - id: user-service-docs
              uri: lb://user-service
              predicates: Path=/api/users/v3/api-docs/**
              filters:
                - RewritePath=/api/users(?<segment>.*), /$\{segment}
            - id: incident-service
              uri: lb://incident-service
              predicates: Path=/api/incidents/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: incident-service
                    fallbackUri: forward:/fallback/incidents
            - id: notification-service
              uri: lb://notification-service
              predicates: Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notifications
            - id: user-service
              uri: lb://user-service
              predicates: Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/users
  # Auth/JWT is intentionally disabled (SecurityConfig permits all) until
  # Keycloak is integrated again.

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

app:
  rate-limit:
    limit-for-period: 10
    refresh-period: 5s

scalar:
  enabled: true
  path: /scalar
  sources:
    - title: API Gateway
      url: /v3/api-docs
      default: true
    - title: Incident Service
      url: /api/incidents/v3/api-docs
    - title: User Service
      url: /api/users/v3/api-docs
    - title: Notification Service
      url: /api/notifications/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
    instances:
      incident-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      user-service:
        baseConfig: default
